# Central place for every threshold used across the pipeline, so nothing
# ends up hardcoded inline in a notebook.

seed: 42

ingest:                      # reading the raw counts CSV and writing Parquet
  chunksize: 2000
  dtype: int32
  row_group_size: 5000
  parquet_compression: snappy
  prevalence_filter: 0.01    # taxa_prev01.npz — taxa present in >=1% of samples

qc:                          # sample/cohort filtering
  depth_threshold: 10000     # default minimum reads per sample
  depth_sensitivity: [5000, 10000, 20000]   # alternate thresholds for sensitivity checks
  min_cases_per_project: 10
  min_controls_per_project: 10

transform:                   # putting counts on a comparable scale
  clr_pseudocount: 0.5
  clr_prevalence_filter: 0.01   # CLR only applied to the >=1% prevalence matrix

variance:                    # Phase 4 — technical-vs-biological variance partitioning
  distance_subsample_n: 7000    # project-stratified subsample for the dense distance matrices.
                                # IMPLEMENTATION.md suggests 10–15k; 7k keeps each n×n float64
                                # matrix (~0.4 GB) within a dev-machine ceiling (only one of
                                # Bray-Curtis / Aitchison is ever resident). Subsample-size
                                # sensitivity is a Phase 6 check; bump this when RAM allows.
  permutations: 999             # PERMANOVA / adonis permutations (acceptance: ≥999)
  pcoa_dims: 3                  # PCoA axes kept for the ordination plots
  umap_neighbors: 30
  umap_min_dist: 0.1
  classifier:                  # PyTorch project-predictability negative control (step 4)
    max_n: 40000               # project-stratified cap on the CV population (CLR matrix)
    min_project_size: 25       # projects with fewer QC-passed samples are dropped (too few to stratify)
    cv_folds: 5
    epochs: 15
    batch_size: 512
    lr: 0.001
    hidden: [256, 128]
    dropout: 0.3

differential:                # Phase 5 — case/control differential abundance testing
  min_projects_per_category: 2      # a disease category needs >= this many projects to enter 5a/5b
  min_cases_per_category: 100       # ...and >= this many cases pooled across them
  min_cases_per_project: 10         # per (project, category): drop the project below this many cases
  min_controls_per_project: 10      # ...or this many controls (mirrors qc.* — restated for clarity)
  within_prevalence: 0.10           # a taxon must be present in >= 10% of a contrast's samples to be tested
  covariate_min_coverage: 0.80      # age_years / sex used as a covariate only where >= 80% covered in both arms
  meta_min_projects_per_taxon: 2    # 5b: a taxon needs >= this many project-level estimates to be pooled
  fdr_alpha: 0.05
  category_groups:                  # collapse the IBD subtypes — CD / UC / unspecified are one disease family
    IBD_CD: IBD
    IBD_UC: IBD
    IBD: IBD
  pooled_methods: [combat_ols, mixedlm]   # 5c: explicit ComBat correction + project random-effect model
  batch_leakage:                   # 5e — leave-one-project-out vs random k-fold disease classifier
    cv_folds: 5
    models: [logreg, gboost]
    logreg_C: 1.0
    gboost_max_iter: 300
    gboost_learning_rate: 0.05
    gboost_max_depth: 3

prevalence_tiers: [0.01, 0.10]   # alternate prevalence cutoffs for sensitivity checks

validation:                  # re-run the disease-association chain under varied choices
  null_shuffles: 10              # within-block label permutations for the shuffling null
  depth_thresholds: [5000, 10000, 20000]   # minimum-reads cuts to rebuild the cohort at
  prevalence_tiers: [0.01, 0.10]            # compendium-wide taxon-prevalence universe
  literature_top_n: 25           # top replicated hits per disease to cross-check against priors
